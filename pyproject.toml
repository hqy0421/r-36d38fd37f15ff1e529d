[build-system]
requires = ["flit_core ~=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "WarsawGTFS"
authors = [{name = "Mikołaj Kuranowski", email = "mkuranowski+pypackages@gmail.com"}]
readme = "README.md"
dynamic = ["version"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
# Ensure the in-repo package is importable when pytest is run from the
# repository root (or any subdirectory) without an editable install.
pythonpath = ["."]

